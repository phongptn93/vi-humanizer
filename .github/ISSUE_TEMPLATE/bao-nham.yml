name: Báo nhầm / bỏ sót
description: Quy tắc báo một câu đang đúng, hoặc bỏ sót một câu nên báo
labels: [bao-nham]
body:
  - type: input
    id: quy-tac
    attributes:
      label: Mã hoặc tên quy tắc
      placeholder: VI20 / mot-cach
  - type: textarea
    id: van-ban
    attributes:
      label: Đoạn văn bản
      render: markdown
    validations:
      required: true
  - type: textarea
    id: ket-qua
    attributes:
      label: Kết quả của `vi-humanizer scan --format json`
      render: json
  - type: textarea
    id: mong-doi
    attributes:
      label: Mong đợi
    validations:
      required: true
  - type: input
    id: phien-ban
    attributes:
      label: Phiên bản (`vi-humanizer --version`)
